version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: trudnik-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trudnik}
      POSTGRES_USER: ${POSTGRES_USER:-trudnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trudnik_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/067_bootstrap_amvera.sql:/docker-entrypoint-initdb.d/01_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trudnik -d trudnik"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trudnik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass trudnik-local-dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "trudnik-local-dev", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.djadmin
    container_name: trudnik-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEPLOYMENT_ENV=development
      - PORT=8000
    volumes:
      - ./djadmin:/app/djadmin
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  redis_data:

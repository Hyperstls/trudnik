version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: trudnik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  websocket:
    build: .
    container_name: trudnik-websocket
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "${WEBSOCKET_PORT:-8001}:8001"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}
      - WEBSOCKET_PORT=8001
    command: uvicorn websocket_server.main:app --host 0.0.0.0 --port 8001 --log-level info

  celery_worker:
    build: .
    container_name: trudnik-celery-worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE}
      - POSTGREST_URL=${POSTGREST_URL:-http://localhost:3000}
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-notifications@trudnik.ru}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-notifications@trudnik.ru}
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    build: .
    container_name: trudnik-celery-beat
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - celery_beat_data:/data
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE}
      - POSTGREST_URL=${POSTGREST_URL:-http://localhost:3000}
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
    command: celery -A app.tasks.celery_app beat --loglevel=info

  web:
    build: .
    container_name: trudnik-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEPLOYMENT_ENV=development
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - uploads_data:/data/uploads
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: python app.py

volumes:
  redis_data:
  celery_beat_data:
  uploads_data:

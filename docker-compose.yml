version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: trudnik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: trudnik-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: trudnik
      POSTGRES_USER: trudnik
      POSTGRES_PASSWORD: trudnik_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/067_bootstrap_amvera.sql:/docker-entrypoint-initdb.d/01_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trudnik -d trudnik"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: trudnik-postgrest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://trudnik:trudnik_dev@db:5432/trudnik
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL: 10
      PGRST_SERVER_PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trudnik-pgadmin
    restart: unless-stopped
    profiles: ["debug"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trudnik.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

  websocket:
    build: .
    container_name: trudnik-websocket
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "${WEBSOCKET_PORT:-8001}:8001"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}
      - WEBSOCKET_PORT=8001
    command: uvicorn websocket_server.main:app --host 0.0.0.0 --port 8001 --log-level info

  celery_worker:
    build: .
    container_name: trudnik-celery-worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE}
      - POSTGREST_URL=${POSTGREST_URL:-http://postgrest:3000}
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-notifications@trudnik.ru}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-notifications@trudnik.ru}
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    build: .
    container_name: trudnik-celery-beat
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - celery_beat_data:/data
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE}
      - POSTGREST_URL=${POSTGREST_URL:-http://postgrest:3000}
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
    command: celery -A app.tasks.celery_app beat --loglevel=info

  web:
    build: .
    container_name: trudnik-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEPLOYMENT_ENV=development
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - POSTGREST_URL=http://postgrest:3000
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
    volumes:
      - ./app:/app/app
      - uploads_data:/data/uploads
    depends_on:
      redis:
        condition: service_started
      postgrest:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: python app.py

volumes:
  redis_data:
  celery_beat_data:
  uploads_data:
  pgdata:
  pgadmin-data:

---
meta:
  environment: docker
  toolchain:
    name: docker
    version: latest
build:
  # Ветка main-jango: Django-компаньон (админка + публичные read-only страницы).
  # Ветка main продолжает деплоить Flask-образ (Dockerfile) проекта trudnik.
  dockerfile: Dockerfile.djadmin
  skip: false
run:
  persistenceMount: /data
  containerPort: 8000

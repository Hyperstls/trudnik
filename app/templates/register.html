{% extends "base.html" %}
{% block title %}Регистрация — Трудник{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h1 class="text-2xl font-bold mb-6 text-center text-neutral-800">Регистрация</h1>
    <form method="POST" action="{{ url_for('auth.register') }}" class="bg-white rounded-lg shadow-md p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <!-- Имя -->
        <div>
            <label for="name" class="block text-sm font-medium text-neutral-700 mb-1">Имя</label>
            <input type="text" id="name" name="name" required autocomplete="name"
                   class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                   placeholder="Иван Петров">
        </div>

        <!-- Email -->
        <div>
            <label for="email" class="block text-sm font-medium text-neutral-700 mb-1">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                   placeholder="ivan@example.com">
        </div>

        <!-- Пароль -->
        <div>
            <label for="password" class="block text-sm font-medium text-neutral-700 mb-1">Пароль</label>
            <input type="password" id="password" name="password" required minlength="4" autocomplete="new-password"
                   class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                   placeholder="Минимум 4 символа">
        </div>

        <!-- Подтверждение пароля -->
        <div>
            <label for="password_confirm" class="block text-sm font-medium text-neutral-700 mb-1">Подтверждение пароля</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="4" autocomplete="new-password"
                   class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                   placeholder="Повторите пароль">
        </div>

        <!-- Роль -->
        <fieldset>
            <legend class="block text-sm font-medium text-neutral-700 mb-2">Я регистрируюсь как:</legend>
            <div class="flex gap-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="role" value="employer" required
                           class="w-4 h-4 text-primary-500 border-neutral-300 focus:ring-primary-500">
                    <span class="text-sm text-neutral-700">Я работодатель</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="role" value="worker" required
                           class="w-4 h-4 text-primary-500 border-neutral-300 focus:ring-primary-500">
                    <span class="text-sm text-neutral-700">Я трудник</span>
                </label>
            </div>
        </fieldset>

        <!-- Согласие с правилами -->
        <div class="flex items-start gap-2">
            <input type="checkbox" id="agree_terms" name="agree_terms" required
                   class="w-4 h-4 mt-0.5 text-primary-500 border-neutral-300 rounded focus:ring-primary-500">
            <label for="agree_terms" class="text-sm text-neutral-600">
                Я согласен с <a href="#" class="text-primary-500 hover:text-primary-600 underline">правилами использования</a> сервиса
            </label>
        </div>

        <!-- Кнопка -->
        <button type="submit"
                class="w-full bg-primary-500 hover:bg-primary-600 text-white py-2 px-4 rounded-lg font-medium touch-target">
            Зарегистрироваться
        </button>
    </form>

    <p class="text-center mt-4 text-neutral-600 text-sm">
        Уже есть аккаунт?
        <a href="{{ url_for('auth.login') }}" class="text-primary-500 hover:text-primary-600 font-medium">
            Войти
        </a>
    </p>
</div>
{% endblock %}

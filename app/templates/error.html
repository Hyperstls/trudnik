<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис временно недоступен</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full text-center">
        <div class="text-6xl mb-4">{{ error_code or '503' }}</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Сервис временно недоступен</h1>
        <p class="text-gray-600 mb-6">{{ message or error or 'Произошла непредвиденная ошибка. Пожалуйста, попробуйте позже.' }}</p>
        <a href="{{ url_for('jobs.index') }}" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
            Вернуться на главную
        </a>
    </div>
</body>
</html>

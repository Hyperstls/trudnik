{% extends "base.html" %}
{% block title %}Ошибка {{ error_code }} — Трудник{% endblock %}
{% block content %}
<div class="text-center py-20">
    <div class="text-6xl mb-4">{{ error_emoji }}</div>
    <h1 class="text-4xl font-bold text-neutral-800 mb-4">{{ error_code }}</h1>
    <p class="text-lg text-neutral-600 mb-8">{{ error_message }}</p>
    <a href="{{ url_for('jobs.index') }}" class="inline-block bg-primary-500 hover:bg-primary-600 text-white px-6 py-3 rounded-lg font-medium touch-target">
        На главную
    </a>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Настройки уведомлений{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-neutral-800 mb-6">⚙️ Настройки уведомлений</h1>

    <form method="POST" class="bg-white rounded-lg shadow-md p-6 space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Email уведомления -->
        <div>
            <h2 class="text-lg font-semibold text-neutral-800 mb-3">📧 Email-уведомления</h2>
            <div class="space-y-3">
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="email_new_messages" value="1"
                           {% if prefs.email_new_messages %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Новые сообщения</span>
                        <p class="text-xs text-neutral-400">Уведомлять о новых сообщениях в чате</p>
                    </div>
                </label>
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="email_applications" value="1"
                           {% if prefs.email_applications %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Отклики</span>
                        <p class="text-xs text-neutral-400">Уведомлять о новых откликах на задания</p>
                    </div>
                </label>
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="email_invitations" value="1"
                           {% if prefs.email_invitations %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Приглашения</span>
                        <p class="text-xs text-neutral-400">Уведомлять о приглашениях на задания</p>
                    </div>
                </label>
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="email_status_changes" value="1"
                           {% if prefs.email_status_changes %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Изменение статуса</span>
                        <p class="text-xs text-neutral-400">Уведомлять об изменении статуса отклика</p>
                    </div>
                </label>
            </div>
        </div>

        <!-- Push уведомления -->
        <div class="border-t border-neutral-200 pt-6">
            <h2 class="text-lg font-semibold text-neutral-800 mb-3">📱 Push-уведомления</h2>
            <div class="space-y-3">
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="push_new_messages" value="1"
                           {% if prefs.push_new_messages %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Новые сообщения</span>
                        <p class="text-xs text-neutral-400">Push-уведомления о новых сообщениях</p>
                    </div>
                </label>
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="push_applications" value="1"
                           {% if prefs.push_applications %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Отклики</span>
                        <p class="text-xs text-neutral-400">Push-уведомления о новых откликах</p>
                    </div>
                </label>
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="push_invitations" value="1"
                           {% if prefs.push_invitations %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Приглашения</span>
                        <p class="text-xs text-neutral-400">Push-уведомления о приглашениях</p>
                    </div>
                </label>
                <label class="flex items-center gap-3 cursor-pointer hover:bg-neutral-50 rounded-lg px-3 py-2 -mx-3">
                    <input type="checkbox" name="push_status_changes" value="1"
                           {% if prefs.push_status_changes %}checked{% endif %}
                           class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500 h-5 w-5">
                    <div>
                        <span class="text-sm font-medium text-neutral-700">Изменение статуса</span>
                        <p class="text-xs text-neutral-400">Push-уведомления об изменении статуса</p>
                    </div>
                </label>
            </div>
        </div>

        <div class="pt-4 border-t border-neutral-200">
            <button type="submit"
                    class="bg-primary-500 hover:bg-primary-600 text-white font-medium px-6 py-3 rounded-lg touch-target transition-colors w-full sm:w-auto">
                💾 Сохранить настройки
            </button>
        </div>
    </form>
</div>
{% endblock %}

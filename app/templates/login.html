{% extends "base.html" %}
{% block title %}Вход — Трудник{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h1 class="text-2xl font-bold mb-6 text-center text-neutral-800">Вход</h1>
    <form method="POST" action="{{ url_for('auth.login') }}" class="bg-white rounded-lg shadow-md p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Email -->
        <div>
            <label for="email" class="block text-sm font-medium text-neutral-700 mb-1">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                   placeholder="ivan@example.com">
        </div>

        <!-- Пароль -->
        <div>
            <label for="password" class="block text-sm font-medium text-neutral-700 mb-1">Пароль</label>
            <input type="password" id="password" name="password" required minlength="4" autocomplete="current-password"
                   class="w-full px-4 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                   placeholder="••••••">
        </div>

        <!-- Запомнить меня -->
        <div class="flex items-center gap-2">
            <input type="checkbox" id="remember" name="remember" value="1"
                   class="w-4 h-4 text-primary-500 border-neutral-300 rounded focus:ring-primary-500">
            <label for="remember" class="text-sm text-neutral-600">Запомнить меня</label>
        </div>

        <!-- Кнопка -->
        <button type="submit"
                class="w-full bg-primary-500 hover:bg-primary-600 text-white py-2 px-4 rounded-lg font-medium touch-target">
            Войти
        </button>
    </form>

    <p class="text-center mt-4 text-neutral-600 text-sm">
        Нет аккаунта?
        <a href="{{ url_for('auth.register') }}" class="text-primary-500 hover:text-primary-600 font-medium">
            Зарегистрироваться
        </a>
    </p>
</div>
{% endblock %}

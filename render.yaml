services:
  - type: web
    name: trudnik
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && curl -fsSL --connect-timeout 10 --max-time 30 -o tailwindcss-linux-x64 https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64 && chmod +x tailwindcss-linux-x64 && ./tailwindcss-linux-x64 -i static/css/tailwind.css -o static/css/tailwind.min.css --minify
    startCommand: uvicorn asgi:application --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: YANDEX_MAPS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
    autoDeploy: true

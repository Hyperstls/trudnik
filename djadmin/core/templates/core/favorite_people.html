{% extends "core/base.html" %}
{% block title %}Избранные люди — Трудник{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Избранные люди</h1>
{% if favs %}
<div class="grid gap-3 sm:grid-cols-2">
  {% for f in favs %}
  <article class="bg-white border border-gray-200 rounded-lg p-4 flex items-center justify-between gap-3">
    <a href="{% url 'core:worker_detail' f.target.pk %}" class="font-semibold hover:underline">{{ f.target.full_name }}</a>
    <form method="post" action="{% url 'core:people_favorite_toggle' f.target.pk %}">{% csrf_token %}
      <button class="border border-gray-300 rounded px-3 py-1 text-sm">Убрать</button>
    </form>
  </article>
  {% endfor %}
</div>
{% else %}
<p class="text-gray-600">Список пуст.</p>
{% endif %}
{% endblock %}

{% extends "core/base.html" %}
{% block title %}{{ title }} — Трудник{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-lg p-6 mt-4">
  <h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <label class="block text-sm font-medium">
      {{ field.label }}
      {{ field }}
      {% for error in field.errors %}<span class="text-red-700 block">{{ error }}</span>{% endfor %}
    </label>
    {% endfor %}
    <div class="flex gap-3">
      <button type="submit" class="bg-gray-900 text-white rounded px-4 py-2 font-medium">Сохранить</button>
      <a href="{% url 'core:jobs' %}" class="border border-gray-300 rounded px-4 py-2">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}

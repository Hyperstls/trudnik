{% extends "core/base.html" %}
{% block title %}Сброс пароля — Трудник{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg p-6 mt-6">
  <h1 class="text-2xl font-bold mb-2">Сброс пароля</h1>
  <p class="text-sm text-gray-600 mb-4">Укажите email — пришлём ссылку восстановления (действует 1 час).</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-gray-900 text-white rounded px-4 py-2 font-medium">Отправить ссылку</button>
  </form>
  <p class="text-sm mt-4"><a href="{% url 'core:login' %}" class="underline">← Вернуться ко входу</a></p>
</div>
{% endblock %}

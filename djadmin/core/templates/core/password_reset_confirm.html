{% extends "core/base.html" %}
{% block title %}Новый пароль — Трудник{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg p-6 mt-6">
  <h1 class="text-2xl font-bold mb-4">Новый пароль</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-gray-900 text-white rounded px-4 py-2 font-medium">Сменить пароль</button>
  </form>
</div>
{% endblock %}

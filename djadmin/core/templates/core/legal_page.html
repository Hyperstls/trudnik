{% extends "core/base.html" %}
{% load i18n %}
{% block title %}{{ page.title|default:_("Документ") }} — Трудник{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-0 py-4 fade-in">
    <div class="bg-white rounded-2xl border border-neutral-200 p-6">
        <h1 class="text-xl sm:text-2xl font-bold text-neutral-800 mb-4">{{ page.title }}</h1>
        <div class="legal-content space-y-4 text-sm text-neutral-600 leading-relaxed">{{ page.content|safe }}</div>
    </div>
</div>
{% endblock %}

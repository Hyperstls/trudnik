{% comment %}UI Field (J139). Params: field (BoundField), label, hint, extra_class. The widget keeps its own classes; errors/aria come from Django.{% endcomment %}<div class="ui-field {{ extra_class }}"><label class="ui-field__label" for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.field.required %} <span class="ui-field__required" aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% if hint %}<p class="ui-field__hint">{{ hint }}</p>{% endif %}{% for error in field.errors %}<p class="ui-field__error" role="alert">{{ error }}</p>{% endfor %}</div>

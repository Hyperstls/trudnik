{% extends "core/base.html" %}
{% block title %}Повторное письмо — Трудник{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg p-6 mt-6">
  <h1 class="text-2xl font-bold mb-2">Подтверждение email</h1>
  <p class="text-sm text-gray-600 mb-4">Введите email — отправим ссылку подтверждения повторно (не чаще раза в 2 минуты).</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input type="email" name="email" required class="w-full border border-gray-300 rounded px-3 py-2" placeholder="email">
    <button type="submit" class="w-full bg-gray-900 text-white rounded px-4 py-2 font-medium">Отправить</button>
  </form>
  <p class="text-sm mt-4"><a href="{% url 'core:login' %}" class="underline">← Ко входу</a></p>
</div>
{% endblock %}

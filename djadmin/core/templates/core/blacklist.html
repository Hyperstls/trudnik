{% extends "core/base.html" %}
{% block title %}Чёрный список — Трудник{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Чёрный список</h1>
{% if rows %}
<div class="grid gap-3">
  {% for b in rows %}
  <article class="bg-white border border-gray-200 rounded-lg p-4 flex items-center justify-between gap-3">
    <span class="font-semibold">{{ b.blocked_user.full_name }}</span>
    <form method="post" action="{% url 'core:people_unblock' b.blocked_user.pk %}">{% csrf_token %}
      <button class="border border-gray-300 rounded px-3 py-1 text-sm">Разблокировать</button>
    </form>
  </article>
  {% endfor %}
</div>
{% else %}
<p class="text-gray-600">Список пуст.</p>
{% endif %}
{% endblock %}

{% comment %}UI Button (J107). Params: label, variant=primary|secondary|danger|ghost, href, type, extra_class.{% endcomment %}
{% if href %}
<a href="{{ href }}" class="inline-flex items-center justify-center px-5 h-10 rounded-xl text-sm font-semibold {% if variant == 'secondary' %}border border-neutral-200 bg-white text-neutral-700 hover:bg-neutral-50{% elif variant == 'danger' %}bg-red-600 text-white hover:bg-red-700{% elif variant == 'ghost' %}text-neutral-600 hover:bg-neutral-100{% else %}bg-primary-600 text-white hover:bg-primary-700 shadow-sm{% endif %} {{ extra_class }}">{{ label }}</a>
{% else %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center justify-center px-5 h-10 rounded-xl text-sm font-semibold {% if variant == 'secondary' %}border border-neutral-200 bg-white text-neutral-700 hover:bg-neutral-50{% elif variant == 'danger' %}bg-red-600 text-white hover:bg-red-700{% elif variant == 'ghost' %}text-neutral-600 hover:bg-neutral-100{% else %}bg-primary-600 text-white hover:bg-primary-700 shadow-sm{% endif %} {{ extra_class }}">{{ label }}</button>
{% endif %}

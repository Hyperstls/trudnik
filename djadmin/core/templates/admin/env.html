{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
  <h1>Переменные окружения ({{ env|length }})</h1>
  <ul class="messagelist"><li class="warning">Страница показывает секреты. Не делайте скриншоты в тикеты; после использования ротируйте показанные ключи.</li></ul>
  <div class="module" style="margin-top:1rem">
    <table style="width:100%"><tr><th>Имя</th><th>Значение</th></tr>
    {% for k, v in env.items %}
      <tr><td style="white-space:nowrap"><strong>{{ k }}</strong></td>
          <td><code style="word-break:break-all">{{ v }}</code></td></tr>
    {% endfor %}
    </table>
  </div>
</div>
{% endblock %}

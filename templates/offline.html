<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трудник — Нет сети</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #fafafa;
            color: #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .offline-card {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #fef3c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: #171717; }
        p { font-size: 0.9375rem; color: #737373; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background: #d97706;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9375rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #b45309; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1>Нет подключения к сети</h1>
        <p>Проверьте подключение к интернету и попробуйте снова. Некоторые ранее открытые страницы могут быть доступны.</p>
        <a href="/" class="js-reload-btn btn">Попробовать снова</a>
    </div>
    <script nonce="{{ csp_nonce }}">
        document.querySelector('.js-reload-btn').addEventListener('click', function(e) {
            e.preventDefault();
            location.reload();
        });
    </script>
</body>
</html>

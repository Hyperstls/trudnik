{% extends "base.html" %}
{% block content %}
<div class="p-4">
    <h2 class="text-xl font-bold mb-4">Избранное</h2>
    {% for item in items %}
    <div class="flex items-center gap-2 p-2 border rounded mb-2">
        <img src="{{ item.target.photo_url or url_for('static', filename='default-avatar.png') }}" class="w-10 h-10 rounded-full">
        <span>{{ item.target.full_name }}</span>
        <form action="/unfavorite/{{ item.target.id }}" method="post" class="ml-auto">
            <button class="text-red-500">Удалить</button>
        </form>
    </div>
    {% else %}
    <p>Нет избранных</p>
    {% endfor %}
</div>
{% endblock %}

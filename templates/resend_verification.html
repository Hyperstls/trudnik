{% extends "base.html" %}

{% block title %}Повторное подтверждение email — Трудник{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-sm border border-neutral-100 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary-100 mb-4">
                    <svg class="w-7 h-7 text-primary-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-neutral-800">Подтверждение email</h1>
                <p class="text-sm text-neutral-500 mt-2">
                    Не пришло письмо при регистрации? Введите email — мы отправим ссылку повторно.
                </p>
            </div>

            <form method="post" action="{{ url_for('auth.resend_verification') }}" class="space-y-5">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <div>
                    <label for="email" class="block text-sm font-medium text-neutral-700 mb-1.5">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                           placeholder="you@example.com"
                           class="w-full px-4 py-2.5 rounded-xl border border-neutral-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-all">
                </div>

                <button type="submit"
                        class="w-full py-2.5 px-4 bg-primary-500 hover:bg-primary-600 text-white font-medium rounded-xl transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary-200">
                    Отправить письмо повторно
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{{ url_for('auth.login') }}" class="text-sm text-primary-500 hover:text-primary-600 font-medium transition-colors">← Вернуться ко входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="p-4">
    <h2 class="text-xl font-bold mb-4">Чёрный список</h2>
    {% for item in items %}
    <div class="flex justify-between items-center p-2 border rounded mb-2">
        <span>{{ item.blocked.full_name }}</span>
        <form action="/unblock/{{ item.blocked.id }}" method="post">
            <button class="text-red-500">Разблокировать</button>
        </form>
    </div>
    {% else %}
    <p>Список пуст</p>
    {% endfor %}
</div>
{% endblock %}

{% extends "base.html" %}
{% from '_icons.html' import chevron_left %}
{% block title %}Чеки — Трудник{% endblock %}
{% block content %}
<div class="px-4 pb-24 max-w-lg mx-auto">
    <div class="flex items-center gap-3 mb-5">
        <a href="/profile" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-neutral-100 transition-colors touch-target" aria-label="Назад в профиль">
            {{ chevron_left(20) }}
        </a>
        <h2 class="text-2xl font-bold text-neutral-900">🧾 Чеки</h2>
    </div>

    <p class="text-sm text-neutral-500 mb-5">История чеков (актов выполненных работ)</p>

    <div id="receipts-container" class="space-y-3">
        <div class="flex flex-col items-center justify-center py-12 text-center">
            <div class="w-12 h-12 rounded-full bg-neutral-100 flex items-center justify-center mb-3">
                <svg class="animate-spin h-6 w-6 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </div>
            <p class="text-sm text-neutral-400">Загрузка чеков...</p>
        </div>
    </div>
</div>

<script>
const csrfToken = '{{ csrf_token }}';

function loadReceipts() {
    fetch('/api/receipts/my', {
        headers: {'X-CSRF-Token': csrfToken}
    })
    .then(r => r.json())
    .then(data => {
        const container = document.getElementById('receipts-container');
        if (!data.success) {
            container.innerHTML =
                '<div class="flex flex-col items-center justify-center py-16 text-center">' +
                '<div class="w-20 h-20 rounded-full bg-neutral-100 flex items-center justify-center mb-4">' +
                '<span class="text-2xl">🧾</span></div>' +
                '<p class="text-lg font-semibold text-neutral-700">Ошибка загрузки</p>' +
                '<p class="text-sm text-neutral-400 mt-1">' + escapeHtml(data.error || 'Неизвестная ошибка') + '</p>' +
                '</div>';
            return;
        }

        const receipts = data.receipts || [];
        if (receipts.length === 0) {
            container.innerHTML =
                '<div class="flex flex-col items-center justify-center py-16 text-center">' +
                '<div class="w-20 h-20 rounded-full bg-neutral-100 flex items-center justify-center mb-4">' +
                '<span class="text-3xl">🧾</span></div>' +
                '<p class="text-lg font-semibold text-neutral-700">Чеков пока нет</p>' +
                '<p class="text-sm text-neutral-400 mt-1">Здесь будут отображаться чеки за публикации и выполненные работы</p>' +
                '</div>';
            return;
        }

        let html = '';
        receipts.forEach(function(receipt) {
            const amount = receipt.amount || 0;
            const status = receipt.status || '—';
            const churchName = receipt.church_name || '—';
            const description = receipt.service_description || '—';
            const createdAt = receipt.created_at ? receipt.created_at.slice(0, 10) : '—';
            const receiptJson = receipt.receipt_json;
            const receiptType = receipt.receipt_type || '—';

            const statusBadge = status === 'sent'
                ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Отправлен</span>'
                : status === 'resent'
                ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">Переотправлен</span>'
                : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-neutral-100 text-neutral-600">' + escapeHtml(status) + '</span>';

            const typeLabel = receiptType === 'job_publication'
                ? 'Публикация задания'
                : 'Выполнение работы';

            html += '<div class="app-card bg-white rounded-2xl shadow-sm border border-neutral-100 p-4 transition-all duration-200 hover:border-primary-200">' +
                '<div class="flex items-start justify-between mb-2">' +
                    '<div class="flex-1 min-w-0">' +
                        '<p class="font-semibold text-neutral-900 text-sm truncate">' + escapeHtml(churchName) + '</p>' +
                        '<p class="text-xs text-neutral-400 mt-0.5">' + escapeHtml(typeLabel) + '</p>' +
                    '</div>' +
                    statusBadge +
                '</div>' +
                '<p class="text-sm text-neutral-600 line-clamp-2 mb-2">' + escapeHtml(description) + '</p>' +
                '<div class="flex items-center justify-between">' +
                    '<div class="flex items-center gap-3">' +
                        '<span class="text-lg font-bold text-primary-600">' + amount.toLocaleString('ru-RU') + ' ₽</span>' +
                        '<span class="text-xs text-neutral-400">' + escapeHtml(createdAt) + '</span>' +
                    '</div>' +
                    (receiptJson
                        ? '<button onclick="downloadReceipt(\'' + escapeHtml(receipt.id) + '\', ' + JSON.stringify(receiptJson).replace(/"/g, '"') + ')" class="text-xs text-primary-600 hover:text-primary-700 font-medium transition-colors">📄 Скачать чек</button>'
                        : '') +
                '</div>' +
            '</div>';
        });

        container.innerHTML = html;
    })
    .catch(function() {
        document.getElementById('receipts-container').innerHTML =
            '<div class="flex flex-col items-center justify-center py-16 text-center">' +
            '<div class="w-20 h-20 rounded-full bg-neutral-100 flex items-center justify-center mb-4">' +
            '<span class="text-2xl">🧾</span></div>' +
            '<p class="text-lg font-semibold text-neutral-700">Ошибка соединения</p>' +
            '<p class="text-sm text-neutral-400 mt-1">Проверьте подключение к интернету</p>' +
            '</div>';
    });
}

function downloadReceipt(receiptId, receiptJson) {
    // Создаём текстовое представление чека для скачивания
    const data = typeof receiptJson === 'string' ? JSON.parse(receiptJson) : receiptJson;
    const text = JSON.stringify(data, null, 2);
    const blob = new Blob([text], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cheque_' + receiptId.slice(0, 8) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = String(text || '');
    return div.innerHTML;
}

loadReceipts();
</script>
{% endblock %}

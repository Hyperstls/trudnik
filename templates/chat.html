{% extends "base.html" %}
{% block content %}
<div class="flex flex-col h-[calc(100vh-8rem)]">
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2">
        {% for msg in messages %}
        <div class="max-w-[80%] p-2 rounded {% if msg.sender_id == user_id %}bg-gold text-white ml-auto{% else %}bg-gray-200{% endif %}">
            {{ msg.content }}
        </div>
        {% endfor %}
    </div>
    <div class="p-2 border-t flex gap-2">
        <input id="message-input" type="text" class="flex-1 border rounded p-2" placeholder="Сообщение...">
        <button onclick="sendMessage()" class="bg-burgundy text-white px-4 rounded">Отправить</button>
    </div>
</div>
<script>
    async function sendMessage() {
        const input = document.getElementById('message-input');
        const content = input.value.trim();
        if (!content) return;
        await fetch('/api/send_message', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ shift_id: "{{ shift_id }}", content: content })
        });
        input.value = '';
        location.reload();
    }
    window.onload = () => {
        const msgs = document.getElementById('messages');
        msgs.scrollTop = msgs.scrollHeight;
    };
</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}

    <h1 class="text-3xl font-bold text-neutral-900 mb-2">Ошибка</h1>
    <p class="text-neutral-500 text-center max-w-md">{{ error }}</p>

        На главную
    </a>
</div>
{% endblock %}

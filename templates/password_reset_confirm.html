{% extends "base.html" %}

{% block title %}Новый пароль — Трудник{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-sm border border-neutral-100 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary-100 mb-4">
                    <svg class="w-7 h-7 text-primary-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-neutral-800">Новый пароль</h1>
                <p class="text-sm text-neutral-500 mt-2">
                    Придумайте новый пароль для вашего аккаунта.
                </p>
            </div>

            <form method="post" action="{{ url_for('auth.password_reset_confirm', token=token) }}" class="space-y-5">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="token" value="{{ token }}">
                <div>
                    <label for="password" class="block text-sm font-medium text-neutral-700 mb-1.5">
                        Новый пароль
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           required aria-required="true"
                           minlength="8"
                           autocomplete="new-password"
                           placeholder="Минимум 8 символов"
                           class="w-full px-4 py-2.5 rounded-xl border border-neutral-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-all">
                    <p class="text-xs text-neutral-400 mt-1">Минимум 8 символов: A-Z, a-z, 0-9, спецсимвол</p>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-neutral-700 mb-1.5">
                        Повторите пароль
                    </label>
                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           required aria-required="true"
                           minlength="8"
                           autocomplete="new-password"
                           placeholder="Повторите новый пароль"
                           class="w-full px-4 py-2.5 rounded-xl border border-neutral-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-all">
                </div>

                <button type="submit"
                        class="w-full py-2.5 px-4 bg-primary-500 hover:bg-primary-600 text-white font-medium rounded-xl transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary-200">
                    Изменить пароль
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{{ url_for('auth.login') }}" class="text-sm text-primary-500 hover:text-primary-600 font-medium transition-colors">
                    ← Вернуться ко входу
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

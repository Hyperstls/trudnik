{% extends "base.html" %}
{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-neutral-200 p-6 sm:p-8 fade-in">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center mx-auto mb-3 shadow-sm">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-neutral-800">Регистрация</h1>
            <p class="text-sm text-neutral-500 mt-1">Создайте аккаунт в Трудник</p>
        </div>

        <!-- Progress Bar -->
        <div class="flex items-center gap-2 mb-6">
            <div class="flex-1 h-2 rounded-full bg-neutral-200 overflow-hidden">
                <div id="progress-bar" class="h-full rounded-full bg-primary-500 transition-all duration-500 ease-out" style="width: 50%"></div>
            </div>
            <span id="step-label" class="text-xs font-medium text-neutral-500 shrink-0">Шаг 1 из 2</span>
        </div>

        <form method="post" id="register-form">
            <!-- ===== Шаг 1: Аккаунт ===== -->
            <div id="step-1" class="space-y-4">
                <div class="floating-label-group">
                    <input type="text" name="full_name" id="full_name" placeholder=" " required>
                    <label for="full_name">Полное имя <span class="text-danger">*</span></label>
                    <div class="error-text">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span>Введите имя</span>
                    </div>
                </div>

                <div class="floating-label-group">
                    <input type="email" name="email" id="email" placeholder=" " required autocomplete="email">
                    <label for="email">Email <span class="text-danger">*</span></label>
                    <div class="error-text">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span>Введите корректный email</span>
                    </div>
                </div>

                <div class="floating-label-group">
                    <input type="password" name="password" id="password" placeholder=" " required minlength="6">
                    <label for="password">Пароль <span class="text-danger">*</span></label>
                    <div class="error-text">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span>Минимум 6 символов</span>
                    </div>
                </div>

                <!-- Role selection cards -->
                <div>
                    <label class="block text-sm font-semibold text-neutral-700 mb-2">Роль <span class="text-danger">*</span></label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="role-card cursor-pointer border-2 border-neutral-200 rounded-xl p-4 text-center hover:border-primary-300 transition-all duration-200 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50 has-[:checked]:shadow-sm" tabindex="0">
                            <input type="radio" name="role" value="worker" class="sr-only" required>
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-2 text-neutral-400 group-has-[:checked]:text-primary-500">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <div class="text-sm font-semibold text-neutral-700">Трудник</div>
                            <div class="text-xs text-neutral-400 mt-0.5">Ищу работу</div>
                        </label>
                        <label class="role-card cursor-pointer border-2 border-neutral-200 rounded-xl p-4 text-center hover:border-primary-300 transition-all duration-200 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50 has-[:checked]:shadow-sm" tabindex="0">
                            <input type="radio" name="role" value="employer" class="sr-only">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-2 text-neutral-400 group-has-[:checked]:text-primary-500">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <div class="text-sm font-semibold text-neutral-700">Работодатель</div>
                            <div class="text-xs text-neutral-400 mt-0.5">Ищу сотрудников</div>
                        </label>
                    </div>
                </div>

                <button type="button" id="to-step-2" class="w-full bg-primary-500 hover:bg-primary-600 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Далее
                </button>
            </div>

            <!-- ===== Шаг 2: Профиль ===== -->
            <div id="step-2" class="space-y-4" style="display:none;">
                <!-- Вероисповедание -->
                <div class="floating-label-group">
                    <select name="religion" id="religion">
                        <option value="">Загрузка...</option>
                    </select>
                    <input type="hidden" name="religion_id" id="religion_id" value="">
                    <label for="religion">Вероисповедание</label>
                </div>

                <div class="floating-label-group">
                    <input type="text" name="city" id="city" placeholder=" ">
                    <label for="city">Город</label>
                </div>

                <div class="floating-label-group">
                    <input type="url" name="portfolio_link" id="portfolio_link" placeholder=" ">
                    <label for="portfolio_link">Ссылка на портфолио</label>
                </div>

                <!-- Worker-specific fields -->
                <div id="worker-fields" class="space-y-4" style="display:none;">
                    <!-- Навыки (чекбоксы) — только для трудников -->
                    <div class="floating-label-group">
                        <span class="text-sm text-neutral-500 mb-2 block">Навыки</span>
                        <div id="skills-checkboxes" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-2 border border-neutral-200 rounded-lg" role="group" aria-label="Навыки">
                            <span class="text-sm text-neutral-400 col-span-2">Загрузка...</span>
                        </div>
                    </div>

                    <div class="floating-label-group">
                        <input type="text" name="inn" id="inn" placeholder=" " maxlength="12">
                        <label for="inn">ИНН (12 цифр, опционально)</label>
                        <p class="text-xs text-neutral-400 mt-1 px-1">ИНН для формирования чеков (самозанятые). Будет скрыт до оплаты заказчиком.</p>
                    </div>

                    <label class="flex items-start gap-3 p-3 bg-neutral-50 rounded-xl cursor-pointer">
                        <input type="checkbox" name="is_self_employed" class="mt-0.5 rounded border-neutral-300 text-primary-500 focus:ring-primary-500">
                        <span class="text-sm text-neutral-700">Я зарегистрирован как самозанятый и обязуюсь выдавать чеки заказчикам через приложение «Мой налог» (опционально)</span>
                    </label>

                    <div class="floating-label-group">
                        <input type="text" name="experience" id="experience" placeholder=" ">
                        <label for="experience">Опыт (кратко)</label>
                    </div>

                    <div class="floating-label-group">
                        <input type="number" name="desired_payment" id="desired_payment" placeholder=" ">
                        <label for="desired_payment">Желаемая оплата за смену</label>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button type="button" id="back-to-step-1" class="flex-1 bg-neutral-100 hover:bg-neutral-200 active:scale-[0.98] text-neutral-700 font-semibold py-3.5 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-neutral-300">
                        Назад
                    </button>
                    <button type="submit" class="flex-1 bg-primary-500 hover:bg-primary-600 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
                        Зарегистрироваться
                    </button>
                </div>
            </div>
        </form>

        <p class="mt-6 text-center text-sm text-neutral-500">
            Уже есть аккаунт?
            <a href="/login" class="text-primary-500 font-semibold hover:text-primary-600 transition-colors">Войти</a>
        </p>
    </div>
</div>

<script>
(function() {
    'use strict';

    var form = document.getElementById('register-form');
    var step1 = document.getElementById('step-1');
    var step2 = document.getElementById('step-2');
    var toStep2Btn = document.getElementById('to-step-2');
    var backBtn = document.getElementById('back-to-step-1');
    var progressBar = document.getElementById('progress-bar');
    var stepLabel = document.getElementById('step-label');
    var roleInputs = document.querySelectorAll('input[name="role"]');
    var workerFields = document.getElementById('worker-fields');

    var fullName = document.getElementById('full_name');
    var email = document.getElementById('email');
    var password = document.getElementById('password');

    // ==========================================
    // Валидация Шага 1
    // ==========================================
    function validateStep1() {
        var nameValid = fullName.value.trim().length >= 2;
        var emailValid = email.value.includes('@') && email.value.includes('.');
        var passValid = password.value.length >= 6;
        var roleValid = document.querySelector('input[name="role"]:checked');

        // Toggle error classes
        toggleError(fullName, !nameValid && fullName.value.length > 0);
        toggleError(email, !emailValid && email.value.length > 0);
        toggleError(password, !passValid && password.value.length > 0);

        toStep2Btn.disabled = !(nameValid && emailValid && passValid && roleValid);
    }

    function toggleError(input, show) {
        var group = input.closest('.floating-label-group');
        if (!group) return;
        if (show) {
            group.classList.add('error');
            group.classList.remove('success');
        } else if (input.value) {
            group.classList.remove('error');
            group.classList.add('success');
        } else {
            group.classList.remove('error', 'success');
        }
    }

    fullName.addEventListener('input', validateStep1);
    email.addEventListener('input', validateStep1);
    password.addEventListener('input', validateStep1);
    roleInputs.forEach(function(r) { r.addEventListener('change', validateStep1); });

    // ==========================================
    // Переключение шагов
    // ==========================================
    toStep2Btn.addEventListener('click', function() {
        step1.style.display = 'none';
        step2.style.display = 'block';
        progressBar.style.width = '100%';
        stepLabel.textContent = 'Шаг 2 из 2';
    });

    backBtn.addEventListener('click', function() {
        step2.style.display = 'none';
        step1.style.display = 'block';
        progressBar.style.width = '50%';
        stepLabel.textContent = 'Шаг 1 из 2';
    });

    // ==========================================
    // Показ worker-полей
    // ==========================================
    roleInputs.forEach(function(r) {
        r.addEventListener('change', function() {
            workerFields.style.display = this.value === 'worker' ? 'block' : 'none';
            validateStep1();
        });
    });

    // ==========================================
    // Submit validation
    // ==========================================
    form.addEventListener('submit', function(e) {
        if (!document.querySelector('input[name="role"]:checked')) {
            e.preventDefault();
            window.showToast('Выберите роль', 'warning');
        }
        // Если роль выбрана — форма отправляется штатно
    });

    // ==========================================
    // Keyboard: Enter on role cards
    // ==========================================
    document.querySelectorAll('.role-card').forEach(function(card) {
        card.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                var input = this.querySelector('input');
                if (input) input.checked = true;
                input.dispatchEvent(new Event('change'));
            }
        });
    });

    // Initial validation
    validateStep1();
})();

// Загрузка справочников (навыки и вероисповедания)
async function loadDictionaries() {
    try {
        const [skillsResp, religionsResp] = await Promise.all([
            fetch('/api/skills'),
            fetch('/api/religions')
        ]);
        const skillsData = await skillsResp.json();
        const religionsData = await religionsResp.json();

        // Заполняем чекбоксы навыков
        const skillsDiv = document.getElementById('skills-checkboxes');
        if (skillsDiv && skillsData.skills) {
            skillsDiv.innerHTML = skillsData.skills.map(s =>
                `<label class="flex items-center gap-2 p-1 hover:bg-neutral-50 rounded cursor-pointer">
                    <input type="checkbox" name="skill_ids" value="${s.id}" class="rounded border-neutral-300 text-primary-500 focus:ring-primary-500">
                    <span class="text-sm text-neutral-700">${s.name}</span>
                </label>`
            ).join('');
        }

        // Заполняем селект вероисповеданий
        const religionSelect = document.getElementById('religion');
        if (religionSelect && religionsData.religions) {
            religionSelect.innerHTML = '<option value="">Не указано</option>' +
                religionsData.religions.map(r =>
                    `<option value="${r.name}" data-id="${r.id}">${r.name}</option>`
                ).join('');
            religionSelect.addEventListener('change', function() {
                const opt = this.selectedOptions[0];
                document.getElementById('religion_id').value = opt?.dataset?.id || '';
            });
        }
    } catch (e) {
        console.error('Failed to load dictionaries:', e);
    }
}
document.addEventListener('DOMContentLoaded', loadDictionaries);

</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-20 p-6 bg-white rounded-xl shadow">
    <h1 class="text-2xl font-bold mb-4">Регистрация</h1>
    <form method="post" class="space-y-4">
        <input type="text" name="full_name" placeholder="Полное имя" class="w-full border p-2 rounded" required>
        <input type="email" name="email" placeholder="Email" class="w-full border p-2 rounded" required>
        <input type="password" name="password" placeholder="Пароль" class="w-full border p-2 rounded" required>
        <select name="role" id="role" class="w-full border p-2 rounded" onchange="toggleFields()">
            <option value="worker">Трудник</option>
            <option value="employer">Работодатель</option>
        </select>
        <input type="text" name="city" placeholder="Город" class="w-full border p-2 rounded">
        <div id="worker-fields">
            <!-- Юридически значимое поле: ИНН самозанятого (12 цифр) -->
            <input type="text" name="inn" placeholder="ИНН (12 цифр)" maxlength="12" pattern="\d{12}"
                   title="ИНН должен содержать ровно 12 цифр"
                   class="w-full border p-2 rounded">
            <div class="text-xs text-gray-500 mb-2">ИНН обязателен для самозанятого. Будет скрыт до оплаты заказчиком.</div>
            <!-- Юридически значимое согласие: обязательство выдавать чеки -->
            <label class="flex items-start gap-2 text-sm text-gray-700 mb-2">
                <input type="checkbox" name="is_self_employed" class="mt-1 rounded border-gray-300 text-gold focus:ring-gold">
                <span>Я зарегистрирован как самозанятый и обязуюсь выдавать чеки заказчикам через приложение «Мой налог»</span>
            </label>
            <input type="text" name="experience" placeholder="Опыт (кратко)" class="w-full border p-2 rounded">
            <input type="number" name="desired_payment" placeholder="Желаемая оплата за смену" class="w-full border p-2 rounded">
        </div>
        <!-- Вероисповедание -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Вероисповедание</label>
            <select name="religion" class="w-full border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-gold/30">
                <option value="не указано">Не указано</option>
                <option value="православие">Православие</option>
                <option value="католицизм">Католицизм</option>
                <option value="протестантизм">Протестантизм</option>
                <option value="ислам">Ислам</option>
                <option value="иудаизм">Иудаизм</option>
                <option value="буддизм">Буддизм</option>
                <option value="не важно">Не важно</option>
            </select>
        </div>
        <!-- Навыки -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Навыки (через запятую)</label>
            <input type="text" name="skills" placeholder="уборка, пение, ремонт..."
                   class="w-full border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-gold/30">
        </div>
        <!-- Портфолио -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ссылка на портфолио</label>
            <input type="url" name="portfolio_link" placeholder="https://..."
                   class="w-full border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-gold/30">
        </div>
        <button type="submit" class="w-full bg-burgundy text-white py-2 rounded">Зарегистрироваться</button>
    </form>
    <script>
        function toggleFields() {
            const role = document.getElementById('role').value;
            document.getElementById('worker-fields').style.display = role === 'worker' ? 'block' : 'none';
        }
        toggleFields();
    </script>
</div>
{% endblock %}

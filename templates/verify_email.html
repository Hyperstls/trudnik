{% extends "base.html" %}
{% block title %}Подтверждение email — Трудник{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-8 text-center">
    <h1 class="text-2xl font-bold mb-4">Подтверждение email</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="p-4 rounded-xl mb-4 {% if category == 'success' %}bg-green-50 text-green-700{% elif category == 'danger' %}bg-red-50 text-red-700{% else %}bg-blue-50 text-blue-700{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
    {% endwith %}
    <a href="/login" class="text-primary-500 hover:underline">Войти</a>
</div>
{% endblock %}

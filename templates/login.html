{% extends "base.html" %}
{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-neutral-200 p-6 sm:p-8 fade-in">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center mx-auto mb-3 shadow-sm">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-neutral-800">Вход в аккаунт</h1>
            <p class="text-sm text-neutral-500 mt-1">Добро пожаловать в Трудник</p>
        </div>

        <form method="post" class="space-y-4" novalidate>
            <div class="floating-label-group">
                <input type="email" name="email" id="email" placeholder=" " required autocomplete="email">
                <label for="email">Email</label>
                <div class="error-text">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span>Введите корректный email</span>
                </div>
            </div>

            <div class="floating-label-group relative">
                <input type="password" name="password" id="password" placeholder=" " required minlength="6" autocomplete="current-password">
                <label for="password">Пароль</label>
                <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-600 transition-colors touch-target" aria-label="Показать пароль" tabindex="-1">
                    <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
                <div class="error-text">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span>Введите пароль</span>
                </div>
            </div>

            <button type="submit" class="w-full bg-primary-500 hover:bg-primary-600 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
                Войти
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-neutral-500">
            Нет аккаунта?
            <a href="/register" class="text-primary-500 font-semibold hover:text-primary-600 transition-colors">Зарегистрироваться</a>
        </p>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
document.addEventListener('DOMContentLoaded', function() {
    var form = document.querySelector('form');
    if (!form) return;

    var email = document.getElementById('email');
    var password = document.getElementById('password');

    // Password toggle
    var toggleBtn = document.getElementById('toggle-password');
    var eyeIcon = document.getElementById('eye-icon');
    var eyeOffIcon = document.getElementById('eye-off-icon');
    if (toggleBtn && password && eyeIcon && eyeOffIcon) {
        toggleBtn.addEventListener('click', function() {
            var isPassword = password.type === 'password';
            password.type = isPassword ? 'text' : 'password';
            eyeIcon.classList.toggle('hidden', isPassword);
            eyeOffIcon.classList.toggle('hidden', !isPassword);
            this.setAttribute('aria-label', isPassword ? 'Скрыть пароль' : 'Показать пароль');
        });
    }

    // Real-time validation
    email.addEventListener('blur', function() {
        var group = this.closest('.floating-label-group');
        if (this.value && !this.value.includes('@')) {
            group.classList.add('error');
            group.classList.remove('success');
        } else if (this.value) {
            group.classList.remove('error');
            group.classList.add('success');
        } else {
            group.classList.remove('error', 'success');
        }
    });

    password.addEventListener('blur', function() {
        var group = this.closest('.floating-label-group');
        if (this.value && this.value.length < 6) {
            group.classList.add('error');
            group.classList.remove('success');
        } else if (this.value) {
            group.classList.remove('error');
            group.classList.add('success');
        } else {
            group.classList.remove('error', 'success');
        }
    });

    form.addEventListener('submit', function(e) {
        var valid = true;
        if (!email.value || !email.value.includes('@')) {
            email.closest('.floating-label-group').classList.add('error');
            valid = false;
        }
        if (!password.value || password.value.length < 6) {
            password.closest('.floating-label-group').classList.add('error');
            valid = false;
        }
        if (!valid) {
            e.preventDefault();  // Блокируем отправку только при ошибках валидации
        }
        // Если валидация пройдена — форма отправляется штатно,
        // нативная HTML5-валидация подавлена атрибутом novalidate (см. <form>)
    });
});
</script>
{% endblock %}

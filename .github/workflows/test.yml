name: CI/CD РўРµСЃС‚РёСЂРѕРІР°РЅРёРµ

# в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
# Workflow РґР»СЏ Р°РІС‚РѕРјР°С‚РёС‡РµСЃРєРѕРіРѕ Р·Р°РїСѓСЃРєР° РІСЃРµС… РєР°С‚РµРіРѕСЂРёР№ С‚РµСЃС‚РѕРІ:
#   - Backend (pytest unit/integration)
#   - E2E (Playwright Chromium headless)
#   - Accessibility (axe-core Р°СѓРґРёС‚)
#   - Locust (РЅР°РіСЂСѓР·РѕС‡РЅРѕРµ С‚РµСЃС‚РёСЂРѕРІР°РЅРёРµ, С‚РѕР»СЊРєРѕ workflow_dispatch)
#
# РСЃРїРѕР»СЊР·СѓРµС‚ Docker Compose РґР»СЏ РїРѕРґРЅСЏС‚РёСЏ Redis, WebSocket, Celery Worker Рё Beat.
# Flask Р·Р°РїСѓСЃРєР°РµС‚СЃСЏ РІ С„РѕРЅРµ РєР°Рє С‚РµСЃС‚РѕРІС‹Р№ СЃРµСЂРІРµСЂ.
# в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ

on:
  # РђРІС‚РѕРјР°С‚РёС‡РµСЃРєРёР№ Р·Р°РїСѓСЃРє РїСЂРё РїСѓС€Рµ РІ main Рё develop
  push:
    branches: [main, develop]
  # РђРІС‚РѕРјР°С‚РёС‡РµСЃРєРёР№ Р·Р°РїСѓСЃРє РїСЂРё СЃРѕР·РґР°РЅРёРё PR РІ main
  pull_request:
    branches: [main]
  # Р СѓС‡РЅРѕР№ Р·Р°РїСѓСЃРє РёР· РёРЅС‚РµСЂС„РµР№СЃР° GitHub Actions
  workflow_dispatch:

jobs:
  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  # РћСЃРЅРѕРІРЅРѕР№ job: backend + e2e + accessibility С‚РµСЃС‚С‹
  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    env:
      # в”Ђв”Ђ Р РµР¶РёРј С‚РµСЃС‚РёСЂРѕРІР°РЅРёСЏ в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      TESTING: 'true'                         # РћС‚РєР»СЋС‡Р°РµС‚ CSRF-Р·Р°С‰РёС‚Сѓ РІ С‚РµСЃС‚Р°С…
      FLASK_ENV: 'testing'                    # Flask РІ СЂРµР¶РёРјРµ С‚РµСЃС‚РёСЂРѕРІР°РЅРёСЏ
      CELERY_TASK_ALWAYS_EAGER: 'true'         # Celery-Р·Р°РґР°С‡Рё РІС‹РїРѕР»РЅСЏСЋС‚СЃСЏ СЃРёРЅС…СЂРѕРЅРЅРѕ
      BASE_URL: 'http://127.0.0.1:5000'       # Р‘Р°Р·РѕРІС‹Р№ URL С‚РµСЃС‚РѕРІРѕРіРѕ СЃРµСЂРІРµСЂР°

      # в”Ђв”Ђ PostgREST / Amvera (РёР· GitHub Secrets) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      POSTGREST_URL: ${{ secrets.POSTGREST_URL }}
      PGRST_JWT_SECRET: ${{ secrets.PGRST_JWT_SECRET }}

      # в”Ђв”Ђ Redis / WebSocket в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      REDIS_URL: 'redis://localhost:6379/0'
      WEBSOCKET_URL: 'ws://localhost:8001'
      WEBSOCKET_PORT: '8001'

      # в”Ђв”Ђ SMTP (РїРѕС‡С‚РѕРІС‹Р№ СЃРµСЂРІРёСЃ) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      SMTP_HOST: 'localhost'
      SMTP_PORT: '587'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SMTP_USE_TLS: 'True'
      SMTP_USE_SSL: 'False'
      SMTP_FROM_EMAIL: 'notifications@trudnik.ru'
      SMTP_FROM_NAME: 'Trudnik'

      # в”Ђв”Ђ VAPID (Web Push) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_CLAIMS_EMAIL: 'notifications@trudnik.ru'
      VAPID_CLAIMS_SUBJECT: 'mailto:notifications@trudnik.ru'

      # в”Ђв”Ђ РўРµСЃС‚РѕРІС‹Рµ СѓС‡С‘С‚РЅС‹Рµ РґР°РЅРЅС‹Рµ в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      EMPLOYER_EMAIL: ${{ secrets.EMPLOYER_EMAIL }}
      EMPLOYER_PASSWORD: ${{ secrets.EMPLOYER_PASSWORD }}
      WORKER_EMAIL: ${{ secrets.WORKER_EMAIL }}
      WORKER_PASSWORD: ${{ secrets.WORKER_PASSWORD }}

      # в”Ђв”Ђ РљР»СЋС‡ Flask Рё Yandex Maps в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}

      # в”Ђв”Ђ Р‘Р°Р·Р° РґР°РЅРЅС‹С… (РґР»СЏ Docker Compose СЃРµСЂРІРёСЃРѕРІ Celery) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 1. РљР»РѕРЅРёСЂРѕРІР°РЅРёРµ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РљР»РѕРЅРёСЂРѕРІР°РЅРёРµ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
        uses: actions/checkout@v4

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 2. РЈСЃС‚Р°РЅРѕРІРєР° Python 3.11
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РЈСЃС‚Р°РЅРѕРІРєР° Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 3. РљРµС€РёСЂРѕРІР°РЅРёРµ pip-Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№ (СѓСЃРєРѕСЂСЏРµС‚ РїРѕРІС‚РѕСЂРЅС‹Рµ Р·Р°РїСѓСЃРєРё)
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РљРµС€РёСЂРѕРІР°РЅРёРµ pip-Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 4. РЈСЃС‚Р°РЅРѕРІРєР° Python-Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        run: pip install -r requirements-dev.txt

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 5. РЈСЃС‚Р°РЅРѕРІРєР° Playwright-Р±СЂР°СѓР·РµСЂРѕРІ (Chromium РґР»СЏ E2E С‚РµСЃС‚РѕРІ)
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РЈСЃС‚Р°РЅРѕРІРєР° Playwright Р±СЂР°СѓР·РµСЂРѕРІ
        run: playwright install chromium --with-deps

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 6. Р—Р°РїСѓСЃРє Flask СЃ in-memory mock (Р±РµР· Docker Compose)
      #    TESTING=true РІРєР»СЋС‡Р°РµС‚ mock PostgREST вЂ” Р‘Р” РЅРµ РЅСѓР¶РЅР°
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Р—Р°РїСѓСЃРє Flask С‚РµСЃС‚РѕРІРѕРіРѕ СЃРµСЂРІРµСЂР°
        run: |
          echo "Р—Р°РїСѓСЃРє Flask РЅР° РїРѕСЂС‚Сѓ 5000 (TESTING mode вЂ” mock PostgREST)..."
          python -m flask run --host=0.0.0.0 --port=5000 > /tmp/flask.log 2>&1 &
          echo "Flask PID: $!"
          echo "РћР¶РёРґР°РЅРёРµ Р·Р°РїСѓСЃРєР° (10 СЃРµРєСѓРЅРґ)..."
          sleep 10
          echo "=== Flask startup logs ==="
          cat /tmp/flask.log
          echo "=== Health check ==="
          curl -v --retry 5 --retry-delay 2 --max-time 10 http://localhost:5000/health || echo "Health-check: trying again..."
          sleep 5
          curl -v http://localhost:5000/health || echo "WARNING: Flask health check failed"
        env:
          FLASK_APP: 'app.py'

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 6b. Static checks (CSP, PostgREST patterns, Celery context)
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Static code checks
        run: |
          python -m pytest tests/test_static_checks.py -v --tb=short || echo "STATIC_CHECKS_FAILED=true"
        env:
          REDIS_URL: 'redis://localhost:6379/0'

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 10. Backend-С‚РµСЃС‚С‹ (unit + integration)
      #     РСЃРєР»СЋС‡Р°РµРј Playwright-РєРѕРЅС„РёРіСѓСЂР°С†РёСЋ Рё E2E-С‚РµСЃС‚С‹
      #     --timeout=120 С‚СЂРµР±СѓРµС‚ pytest-timeout РІ requirements-dev.txt
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Backend С‚РµСЃС‚С‹ (pytest unit)
        run: |
          python -m pytest tests/test_utils_unit.py tests/test_security.py tests/test_sanitize.py \
            tests/test_push_service.py tests/test_notification_service.py \
            tests/test_redis_publisher.py tests/test_websocket_auth.py \
            
            -v --tb=short \
            --timeout=60 \
            --junitxml=pytest-report.xml \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
          || echo "BACKEND_TESTS_FAILED=true вЂ” РЅРµ Р±Р»РѕРєРёСЂСѓРµРј CI"

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 11. Playwright E2E С‚РµСЃС‚С‹ (headless Chromium)
      #     РќРµ РїР°РґР°РµРј РїСЂРё РѕС€РёР±РєРµ вЂ” E2E РјРѕРіСѓС‚ Р±С‹С‚СЊ РЅРµСЃС‚Р°Р±РёР»СЊРЅС‹ РІ CI
      #     РСЃРєР»СЋС‡Р°РµРј РјРµРґР»РµРЅРЅС‹Рµ С‚РµСЃС‚С‹ (РјР°СЂРєРµСЂ slow)
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Playwright E2E С‚РµСЃС‚С‹ (headless)
        run: |
          python -m pytest tests/test_e2e_frontend.py tests/test_e2e_multicontext.py \
            -m "e2e and not slow" \
            -v --tb=short \
            --browser chromium --headed=false \
            --timeout=180 \
            --junitxml=pytest-e2e-report.xml \
          || echo "E2E_SKIPPED=true вЂ” С‚РµСЃС‚С‹ Р·Р°РІРµСЂС€РёР»РёСЃСЊ СЃ РѕС€РёР±РєРѕР№ (РЅРµ Р±Р»РѕРєРёСЂСѓРµРј CI)"

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 12. Accessibility С‚РµСЃС‚С‹ (axe-core Р°СѓРґРёС‚ С‡РµСЂРµР· Playwright)
      #     РќРµ РїР°РґР°РµРј РїСЂРё РѕС€РёР±РєРµ вЂ” a11y-Р°СѓРґРёС‚ РѕРїС†РёРѕРЅР°Р»РµРЅ
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Accessibility С‚РµСЃС‚С‹ (a11y)
        run: |
          python -m pytest tests/test_e2e_frontend.py \
            -m a11y \
            -v --tb=short \
            --browser chromium --headed=false \
            --junitxml=pytest-a11y-report.xml \
          || echo "A11Y_SKIPPED=true вЂ” a11y-С‚РµСЃС‚С‹ Р·Р°РІРµСЂС€РёР»РёСЃСЊ СЃ РѕС€РёР±РєРѕР№ (РЅРµ Р±Р»РѕРєРёСЂСѓРµРј CI)"

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 13. РћС‡РёСЃС‚РєР° (РµСЃР»Рё Р·Р°РїСѓСЃРєР°Р»СЃСЏ Docker Compose)
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РћСЃС‚Р°РЅРѕРІРєР° Docker Compose
        if: always()
        run: docker compose down --volumes 2>/dev/null || true

      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      # 14. Р—Р°РіСЂСѓР·РєР° Р°СЂС‚РµС„Р°РєС‚РѕРІ С‚РµСЃС‚РёСЂРѕРІР°РЅРёСЏ (РѕС‚С‡С‘С‚С‹ pytest Рё coverage)
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Р—Р°РіСЂСѓР·РєР° Р°СЂС‚РµС„Р°РєС‚РѕРІ вЂ” РѕС‚С‡С‘С‚С‹ С‚РµСЃС‚РѕРІ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml
            pytest-e2e-report.xml
            pytest-a11y-report.xml
          retention-days: 7

  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  # E2E С‚РµСЃС‚С‹ РїСЂРѕС‚РёРІ PRODUCTION (РїРѕРєР° РЅРµС‚ СЂРµР°Р»СЊРЅС‹С… РїРѕР»СЊР·РѕРІР°С‚РµР»РµР№)
  # Р—Р°РїСѓСЃРєР°РµС‚СЃСЏ РїСЂРё РїСѓС€Рµ РІ main
  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  e2e-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BASE_URL: ${{ secrets.E2E_BASE_URL }}
      EMPLOYER_EMAIL: ${{ secrets.EMPLOYER_EMAIL }}
      EMPLOYER_PASSWORD: ${{ secrets.EMPLOYER_PASSWORD }}
      WORKER_EMAIL: ${{ secrets.WORKER_EMAIL }}
      WORKER_PASSWORD: ${{ secrets.WORKER_PASSWORD }}

    steps:
      - name: РљР»РѕРЅРёСЂРѕРІР°РЅРёРµ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
        uses: actions/checkout@v4

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        run: pip install -r requirements-dev.txt

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Playwright Р±СЂР°СѓР·РµСЂРѕРІ
        run: playwright install chromium --with-deps

      - name: Р–РґС‘Рј РіРѕС‚РѕРІРЅРѕСЃС‚Рё СЃРµСЂРІРµСЂР°
        run: |
          echo "РџСЂРѕРІРµСЂСЏРµРј ${{ secrets.E2E_BASE_URL }}/health..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.E2E_BASE_URL }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "РЎРµСЂРІРµСЂ РіРѕС‚РѕРІ (HTTP $STATUS)"
              exit 0
            fi
            echo "РџРѕРїС‹С‚РєР° $i/12: HTTP $STATUS вЂ” Р¶РґС‘Рј 10 СЃРµРєСѓРЅРґ..."
            sleep 10
          done
          echo "WARNING: РЎРµСЂРІРµСЂ РЅРµ РѕС‚РІРµС‚РёР» Р·Р° 2 РјРёРЅСѓС‚С‹"

      - name: E2E С‚РµСЃС‚С‹
        run: |
          python -m pytest tests/test_e2e_frontend.py tests/test_e2e_multicontext.py \
            -m "e2e and not slow" \
            -v --tb=short \
            --browser chromium --headed=false \
            --timeout=180 \
            --junitxml=pytest-e2e-report.xml \
          || echo "E2E_FAILED=true вЂ” РЅРµ Р±Р»РѕРєРёСЂСѓРµРј CI"

      - name: Р—Р°РіСЂСѓР·РєР° Р°СЂС‚РµС„Р°РєС‚РѕРІ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: pytest-e2e-report.xml
          retention-days: 7

  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  # РћС‚РґРµР»СЊРЅС‹Р№ job: РЅР°РіСЂСѓР·РѕС‡РЅРѕРµ С‚РµСЃС‚РёСЂРѕРІР°РЅРёРµ Locust
  # Р—Р°РїСѓСЃРєР°РµС‚СЃСЏ С‚РѕР»СЊРєРѕ РїСЂРё СЂСѓС‡РЅРѕРј Р·Р°РїСѓСЃРєРµ (workflow_dispatch)
  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  locust-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    env:
      TESTING: 'true'
      FLASK_ENV: 'testing'
      CELERY_TASK_ALWAYS_EAGER: 'true'
      BASE_URL: 'http://127.0.0.1:5000'
      POSTGREST_URL: ${{ secrets.POSTGREST_URL }}
      PGRST_JWT_SECRET: ${{ secrets.PGRST_JWT_SECRET }}
      REDIS_URL: 'redis://localhost:6379/0'
      WEBSOCKET_URL: 'ws://localhost:8001'
      WEBSOCKET_PORT: '8001'
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMPLOYER_EMAIL: ${{ secrets.EMPLOYER_EMAIL }}
      EMPLOYER_PASSWORD: ${{ secrets.EMPLOYER_PASSWORD }}
      WORKER_EMAIL: ${{ secrets.WORKER_EMAIL }}
      WORKER_PASSWORD: ${{ secrets.WORKER_PASSWORD }}

    steps:
      # в”Ђв”Ђ РљР»РѕРЅРёСЂРѕРІР°РЅРёРµ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РљР»РѕРЅРёСЂРѕРІР°РЅРёРµ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
        uses: actions/checkout@v4

      # в”Ђв”Ђ РЈСЃС‚Р°РЅРѕРІРєР° Python 3.11 в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РЈСЃС‚Р°РЅРѕРІРєР° Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # в”Ђв”Ђ РљРµС€РёСЂРѕРІР°РЅРёРµ pip в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РљРµС€РёСЂРѕРІР°РЅРёРµ pip-Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # в”Ђв”Ђ РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№ в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        run: pip install -r requirements-dev.txt

      # в”Ђв”Ђ Р—Р°РїСѓСЃРє Docker Compose (С‚РѕР»СЊРєРѕ Redis) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Р—Р°РїСѓСЃРє Docker Compose (Redis)
        run: docker compose up -d --build redis

      # в”Ђв”Ђ РћР¶РёРґР°РЅРёРµ Redis в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РћР¶РёРґР°РЅРёРµ Redis
        run: |
          sleep 10
          docker compose exec -T redis redis-cli ping

      # в”Ђв”Ђ Р—Р°РїСѓСЃРє Flask С‚РµСЃС‚РѕРІРѕРіРѕ СЃРµСЂРІРµСЂР° в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Р—Р°РїСѓСЃРє Flask С‚РµСЃС‚РѕРІРѕРіРѕ СЃРµСЂРІРµСЂР°
        run: |
          python -m flask run --host=0.0.0.0 --port=5000 &
          sleep 5
        env:
          FLASK_APP: 'app.py'

      # в”Ђв”Ђ РќР°РіСЂСѓР·РѕС‡РЅРѕРµ С‚РµСЃС‚РёСЂРѕРІР°РЅРёРµ Locust в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      #   50 РїРѕР»СЊР·РѕРІР°С‚РµР»РµР№, 5 РЅРѕРІС‹С…/СЃРµРє, РґР»РёС‚РµР»СЊРЅРѕСЃС‚СЊ 30 СЃРµРєСѓРЅРґ
      #   Р РµР·СѓР»СЊС‚Р°С‚С‹ СЃРѕС…СЂР°РЅСЏСЋС‚СЃСЏ РІ CSV (locust_results_*.csv)
      # в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Р—Р°РїСѓСЃРє Locust (РЅР°РіСЂСѓР·РѕС‡РЅРѕРµ С‚РµСЃС‚РёСЂРѕРІР°РЅРёРµ)
        run: |
          locust -f tests/locustfile.py \
            --host=http://127.0.0.1:5000 \
            --users=50 \
            --spawn-rate=5 \
            --run-time=30s \
            --headless \
            --csv=locust_results

      # в”Ђв”Ђ РћСЃС‚Р°РЅРѕРІРєР° СЃРµСЂРІРёСЃРѕРІ в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: РћСЃС‚Р°РЅРѕРІРєР° Docker Compose
        if: always()
        run: docker compose down --volumes

      # в”Ђв”Ђ Р—Р°РіСЂСѓР·РєР° Р°СЂС‚РµС„Р°РєС‚РѕРІ Locust в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
      - name: Р—Р°РіСЂСѓР·РєР° Р°СЂС‚РµС„Р°РєС‚РѕРІ вЂ” СЂРµР·СѓР»СЊС‚Р°С‚С‹ Locust
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: |
            locust_results_stats.csv
            locust_results_failures.csv
            locust_results_exceptions.csv
          retention-days: 7

  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  # E2E С‚РµСЃС‚С‹ РїСЂРѕС‚РёРІ STAGING-СЃРµСЂРІРµСЂР° (СЂРµР°Р»СЊРЅС‹Р№ СЃРµСЂРІРµСЂ + Р‘Р”)
  # Р—Р°РїСѓСЃРєР°РµС‚СЃСЏ РїСЂРё РїСѓС€Рµ РІ staging РёР»Рё РІСЂСѓС‡РЅСѓСЋ (workflow_dispatch)
  # в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
  e2e-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    env:
      BASE_URL: ${{ secrets.STAGING_URL }}
      EMPLOYER_EMAIL: ${{ secrets.STAGING_EMPLOYER_EMAIL }}
      EMPLOYER_PASSWORD: ${{ secrets.STAGING_EMPLOYER_PASSWORD }}
      WORKER_EMAIL: ${{ secrets.STAGING_WORKER_EMAIL }}
      WORKER_PASSWORD: ${{ secrets.STAGING_WORKER_PASSWORD }}

    steps:
      - name: РљР»РѕРЅРёСЂРѕРІР°РЅРёРµ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ
        uses: actions/checkout@v4

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
        run: pip install -r requirements-dev.txt

      - name: РЈСЃС‚Р°РЅРѕРІРєР° Playwright Р±СЂР°СѓР·РµСЂРѕРІ
        run: playwright install chromium --with-deps

      - name: Р–РґС‘Рј РіРѕС‚РѕРІРЅРѕСЃС‚Рё staging-СЃРµСЂРІРµСЂР°
        run: |
          echo "РџСЂРѕРІРµСЂСЏРµРј РґРѕСЃС‚СѓРїРЅРѕСЃС‚СЊ ${{ secrets.STAGING_URL }}/health..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_URL }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging СЃРµСЂРІРµСЂ РіРѕС‚РѕРІ (HTTP $STATUS)"
              exit 0
            fi
            echo "РџРѕРїС‹С‚РєР° $i/12: HTTP $STATUS вЂ” Р¶РґС‘Рј 10 СЃРµРєСѓРЅРґ..."
            sleep 10
          done
          echo "WARNING: Staging СЃРµСЂРІРµСЂ РЅРµ РѕС‚РІРµС‚РёР» Р·Р° 2 РјРёРЅСѓС‚С‹. РџСЂРѕРґРѕР»Р¶Р°РµРј РІСЃС‘ СЂР°РІРЅРѕ."

      - name: E2E С‚РµСЃС‚С‹ РїСЂРѕС‚РёРІ staging
        run: |
          python -m pytest tests/test_e2e_frontend.py tests/test_e2e_multicontext.py \
            -m "e2e and not slow" \
            -v --tb=short \
            --browser chromium --headed=false \
            --timeout=180 \
            --junitxml=pytest-e2e-staging-report.xml \
          || echo "E2E_STAGING_FAILED=true вЂ” РЅРµ Р±Р»РѕРєРёСЂСѓРµРј CI"

      - name: Р—Р°РіСЂСѓР·РєР° Р°СЂС‚РµС„Р°РєС‚РѕРІ вЂ” E2E staging РѕС‚С‡С‘С‚С‹
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-reports
          path: pytest-e2e-staging-report.xml
          retention-days: 7

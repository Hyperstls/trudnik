name: CI

on:
  push:
    branches: [main, main-jango]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: djadmin/requirements.txt
      - run: pip install -r djadmin/requirements.txt
      - run: python -m compileall -q djadmin
      - run: python djadmin/manage.py check
      - run: python djadmin/manage.py makemigrations core --check --dry-run

  tailwind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code static/css/tailwind.min.css

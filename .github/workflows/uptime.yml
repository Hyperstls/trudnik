name: Uptime

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/uptime_check.py"
      - ".github/workflows/uptime.yml"
  schedule:
    - cron: "*/30 * * * *"
# Прод на паузе до уведомления РКН: job скипается при repository variable
# PROD_PAUSED=true. При возобновлении прода выставить PROD_PAUSED=false.

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: vars.PROD_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe production
        run: python3 scripts/uptime_check.py
      - name: Open or update outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Uptime: production probe failed"
          body="Автоматическая проверка прода упала $(date -u +'%Y-%m-%d %H:%M UTC'). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Close outage issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Uptime: production probe failed"
          number=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Проверка снова проходит $(date -u +'%Y-%m-%d %H:%M UTC')."
          fi

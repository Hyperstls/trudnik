name: E2E

on:
  workflow_dispatch:
  push:
    branches: [feat/agent-pipeline, main]
    paths:
      - "djadmin/**"
      - "static/**"
      - "scripts/e2e/**"
      - "scripts/dump_schema.py"
      - "tests/fixtures/schema.sql"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "djadmin/**"
      - "static/**"
      - "scripts/e2e/**"
      - "tests/fixtures/schema.sql"

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: trudnik
          POSTGRES_USER: trudnik
          POSTGRES_PASSWORD: trudnik_ci_password  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trudnik -d trudnik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEPLOYMENT_ENV: development
      SECRET_KEY: ci-only-not-a-secret  # pragma: allowlist secret
      DATABASE_URL: postgresql://trudnik:trudnik_ci_password@localhost:5432/trudnik  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: djadmin/requirements.txt
      - run: pip install -r djadmin/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load schema fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/schema.sql
      - name: Critical-path E2E
        run: bash scripts/e2e/run_critical_flows.sh

name: Build Android APK (TWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore trudnik-release.keystore \
            -alias trudnik \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEYSTORE_PASSWORD }} \
            -dname "CN=Trudnik, OU=Dev, O=Trudnik, L=Moscow, S=Moscow, C=RU"

      - name: Check if TWA config exists
        id: check_twa
        run: |
          if [ -f "twa-config.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "TWA config not found — skipping APK build"
          fi

      - name: Generate TWA project (non-interactive)
        if: steps.check_twa.outputs.exists == 'true'
        run: node generate_twa_ci.js

      - name: Build signed APK
        if: steps.check_twa.outputs.exists == 'true'
        working-directory: twa-project
        run: bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK artifact
        if: steps.check_twa.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trudnik-apk
          path: twa-project/app-release-signed.apk

      - name: Upload AAB artifact (Google Play preferred)
        if: steps.check_twa.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trudnik-aab
          path: twa-project/app-release-bundle.aab

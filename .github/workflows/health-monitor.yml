name: Health Monitor

on:
  schedule:
    - cron: '*/10 * * * *'  # РєР°Р¶РґС‹Рµ 10 РјРёРЅСѓС‚
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check health
        id: health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://trudnik-hyperstls.amvera.io/health || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            BODY=$(curl -s --max-time 10 https://trudnik-hyperstls.amvera.io/health 2>/dev/null || echo "unreachable")
            echo "body=$BODY" >> $GITHUB_OUTPUT
          fi

      - name: Alert Telegram (optional)
        if: ${{ steps.health.outputs.status != '200' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TG_ALERT_CHAT_ID != '' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TG_ALERT_CHAT_ID }}\",\"text\":\"рџ”ґ РўСЂСѓРґРЅРёРє: health=${{ steps.health.outputs.status }}\"}"
        continue-on-error: true

      - name: Fail if unhealthy
        if: steps.health.outputs.status != '200'
        run: exit 1

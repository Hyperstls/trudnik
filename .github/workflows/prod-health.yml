name: Prod Health

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check health
        id: health
        run: |
          # 3 попытки с интервалом 60с: не ловим 503 во время деплоя Amvera
          STATUS="000"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://trudnik-hyperstls.amvera.io/health || echo "000")
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 60
          done
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            BODY=$(curl -s --max-time 10 https://trudnik-hyperstls.amvera.io/health 2>/dev/null || echo "unreachable")
            echo "body=$BODY" >> $GITHUB_OUTPUT
          fi

      - name: Alert Telegram (optional)
        if: ${{ steps.health.outputs.status != '200' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TG_ALERT_CHAT_ID != '' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TG_ALERT_CHAT_ID }}\",\"text\":\"TRUDNIK ALERT: health=${{ steps.health.outputs.status }}\"}"
        continue-on-error: true

      - name: Fail if unhealthy
        if: steps.health.outputs.status != '200'
        run: exit 1

name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "djadmin/**"
      - "static/js/**"
      - "tests_js/**"
      - "tests/fixtures/schema.sql"
      - "migrations/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: trudnik
          POSTGRES_USER: trudnik
          POSTGRES_PASSWORD: trudnik_ci_password  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trudnik -d trudnik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEPLOYMENT_ENV: development
      SECRET_KEY: ci-only-not-a-secret  # pragma: allowlist secret
      DATABASE_URL: postgresql://trudnik:trudnik_ci_password@localhost:5432/trudnik_unit  # pragma: allowlist secret
      DATABASE_ADMIN_URL: postgresql://trudnik:trudnik_ci_password@localhost:5432/postgres  # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      MIGRATIONS_ENABLED: "false"
      GLOBAL_RATE_LIMIT_PER_MIN: "10000"
      YANDEX_MAPS_API_KEY: "test-key"  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS unit tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: djadmin/requirements.txt
      - run: pip install -r djadmin/requirements.txt
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create unit database
        run: psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE trudnik_unit"
      - name: Load schema fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/schema.sql
      - name: Fake migration ledger
        run: python djadmin/manage.py migrate --fake --noinput
      - name: Clone test database
        run: psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE trudnik_test TEMPLATE trudnik_unit"
      - name: Run full unit test suite
        run: python djadmin/manage.py test core --keepdb -v 1

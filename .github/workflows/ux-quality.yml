name: UX quality

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
# Прод на паузе до уведомления РКН: jobs скипаются при PROD_PAUSED=true.

permissions:
  contents: read

# Live-production audit: never run two probes against the same deploy.
concurrency:
  group: ux-quality
  cancel-in-progress: true

jobs:
  lighthouse:
    if: vars.PROD_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse CI (mobile budgets)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true

  axe:
    if: vars.PROD_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm install --no-save playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - name: axe-core critical audit
        run: node scripts/axe_audit.mjs
      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-report
          path: axe-report.json

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:uvicorn]
command=uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 65
directory=/app/djadmin
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery_worker]
command=celery -A core.celery_app worker --loglevel=info --concurrency=2
directory=/app/djadmin
environment=PYTHONPATH="/app/djadmin",DJANGO_SETTINGS_MODULE="config.settings"
autostart=true
autorestart=true
stopwaitsecs=310
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery_beat]
command=celery -A core.celery_app beat --loglevel=info
directory=/app/djadmin
environment=PYTHONPATH="/app/djadmin",DJANGO_SETTINGS_MODULE="config.settings"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
